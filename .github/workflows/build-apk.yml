name: Build SYSTEM CORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Web build successful."

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.systemcore.app",
            "appName": "SYSTEM CORE",
            "webDir": "dist"
          }
          EOF

          echo "Capacitor configuration created:"
          cat capacitor.config.json

      - name: Prepare Android project
        run: |
          if [ -d "android" ]; then
            echo "Existing Android project detected."
          else
            echo "Creating Android project..."
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SYSTEM CORE APK successfully generated!"
          ls -lh "$APK"

      - name: Upload SYSTEM CORE APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-CORE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
