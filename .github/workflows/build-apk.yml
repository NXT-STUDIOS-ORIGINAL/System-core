name: Build SYSTEM CORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Install Java
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install npm dependencies
      # npm install is used because the repository currently
      # does not contain package-lock.json.
      - name: Install dependencies
        run: npm install

      # 5. Build React/Vite application
      - name: Build web application
        run: npm run build

      # 6. Verify web build
      - name: Verify web build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Web build successful."
          ls -la dist

      # 7. Make sure Capacitor exists
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 8. Create Android project if necessary
      - name: Prepare Android project
        run: |
          if [ -d "android" ]; then
            echo "Existing Android project detected."
          else
            echo "No Android project detected."
            echo "Creating Android project..."
            npx cap add android
          fi

      # 9. Synchronize web app with Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 10. Make Gradle executable
      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      # 11. Build APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 12. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "SYSTEM CORE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload SYSTEM CORE APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-CORE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7      - name: Build web application
        run: npm run build

      # 5. Verify the Vite output exists
      - name: Verify web build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Web build successful."
          ls -la dist

      # 6. Install Capacitor if it is not already in package.json
      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7. Check whether Android project already exists
      - name: Check Android project
        run: |
          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Creating Android project..."
            npx cap add android
          fi

      # 8. Configure/synchronize Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 10. Make Gradle executable
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # 11. Build debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 12. Verify APK exists
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 13. Upload APK so you can download it
      - name: Upload SYSTEM CORE APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-CORE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
